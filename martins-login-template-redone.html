{% extends 'base_auth.html' %}
{% block title %}Login · Martins System{% endblock %}

{% block content %}
<section id="martinsLoginPage" class="martins-login-shell">
  <div class="martins-login-card">
    <div class="martins-login-logo-wrap">
      <img
        src="{{ url_for('static', filename='img/martins-logo.png') }}"
        class="martins-login-logo"
        width="230"
        height="104"
        alt="Martins Logo"
      >
    </div>

    <form method="POST" class="martins-login-form">
      <div class="martins-login-field">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="martins-login-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="martins-login-button" type="submit">Login</button>

      <nav class="martins-login-links" aria-label="Login help">
        <a href="{{ url_for('auth.reset_password') }}">Forgot password?</a>
        <a href="{{ url_for('auth.register') }}">Register account</a>
      </nav>
    </form>
  </div>
</section>
{% endblock %}
