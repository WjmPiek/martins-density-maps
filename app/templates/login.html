{% extends 'base_auth.html' %}
{% block title %}Login · Martins System{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card auth-card-wide martins-login-card">
    <div class="martins-login-header">
      <strong>Martins Login</strong>
      <span>Density Maps</span>
    </div>
    <div class="martins-auth-brand">
      <img
        src="{{ url_for('static', filename='img/martins-logo.png') }}"
        class="login-logo"
        width="220"
        height="100"
        alt="Martins Logo"
      >
      <strong>Martins System</strong>
      <span>Density Maps</span>
    </div>

    <form method="POST" class="auth-form martins-login-body">
      <label>
        Email
        <input type="email" name="email" required>
      </label>

      <label>
        Password
        <input type="password" name="password" required>
      </label>

      <button class="primary-btn martins-login-submit" type="submit">Login</button>

      <div class="auth-footer">
        <div class="auth-footer-link">
          <a href="{{ url_for('auth.reset_password') }}">forgot my password</a>
        </div>
        <a href="{{ url_for('auth.register') }}">Register New User</a>
      </div>

      <button class="auth-install" id="installApp" type="button" hidden>
        <img src="{{ url_for('static', filename='img/martins-logo.png') }}" alt="Martins logo" class="install-favicon">
        <span>Install App</span>
      </button>
      <div class="auth-install-help" id="installHelp" hidden></div>
    </form>
  </div>
</section>
{% endblock %}
